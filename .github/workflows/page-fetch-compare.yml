name: Test de lecture des pages (Vercel ou GitHub)

# Étape 3 du chantier Synthèses du jour, à lancer à la main (Actions > Test de lecture des
# pages > Run workflow). Lit le même échantillon de pages d'articles depuis Vercel et depuis
# GitHub Actions, puis compare les taux de succès ; le tableau s'affiche sur la page de
# l'exécution. Lecture seule : aucun appel au modèle, aucune écriture en base, sans coût IA.
on:
  workflow_dispatch:
    inputs:
      per_zone:
        description: "Articles au plus par zone (5 zones, 24 au maximum)"
        default: "12"
      hours:
        description: "Articles publiés depuis (heures)"
        default: "72"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: https://sahel-conflict-map.vercel.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Vérifier le secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Secret CRON_SECRET absent : Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comparer la lecture des pages
        run: npx tsx scripts/page-fetch-compare.ts --per-zone=${{ inputs.per_zone }} --hours=${{ inputs.hours }}
