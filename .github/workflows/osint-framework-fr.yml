name: Traduction des outils OSINT

# À lancer à la main (Actions > Traduction des outils OSINT > Run workflow), une fois, puis de temps en temps si la
# liste d'outils change. Traduit en français les fiches de la carte « Mon espace > Outils » avec le modèle des
# synthèses du jour (de l'ordre de 1 $ pour les quelque 1 100 outils, estimation affichée à la fin) et enregistre
# public/data/osint-framework.fr.json. Reprenable : les outils déjà traduits ne sont pas refaits.
# Pour essayer sur quelques outils d'abord : champ « limite » (par exemple 40).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre maximum d'outils à traduire (vide : tous)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: osint-framework-fr
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRIEFS_MODEL: ${{ vars.BRIEFS_MODEL }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - name: Vérifier le secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Secret ANTHROPIC_API_KEY absent : Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Traduire les fiches
        run: |
          if [ -n "$LIMIT" ]; then
            npx tsx scripts/translate-osint-framework.ts "--limit=$LIMIT"
          else
            npx tsx scripts/translate-osint-framework.ts
          fi

      - name: Enregistrer s'il y a du nouveau
        run: |
          if git diff --quiet -- public/data/osint-framework.fr.json && [ -z "$(git ls-files --others --exclude-standard public/data/osint-framework.fr.json)" ]; then
            echo "::notice::Rien de nouveau à enregistrer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/osint-framework.fr.json
          git commit -m "Carte des outils OSINT : traduction française des fiches mise à jour"
          git push
          echo "::notice::Traductions enregistrées."
