name: Synthèses du jour

# Remplace le cron Vercel de sync-briefs (le plan Hobby n'autorise qu'une
# exécution par jour et à l'heure près). Une seule exécution par jour pour
# maîtriser le coût de l'API : 6 h 05 UTC = 8 h 05 à Paris en heure d'été (7 h 05
# en hiver). Les 5 minutes évitent le pic de charge de GitHub à l'heure pile.
# Une zone dont le lot d'articles est mince et récent est reportée sans appel au
# modèle (règles dans lib/aiBudget.ts) ; ses articles restent en attente.
on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

# Jamais deux exécutions en même temps (relance manuelle pendant un passage planifié).
permissions:
  actions: read
  contents: read

concurrency:
  group: sync-briefs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_URL: https://sahel-conflict-map.vercel.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      # Le cron de Vercel lance ce workflow à l'heure (route /api/cron/dispatch). La
      # planification ci-dessus reste en secours : si un lancement de la journée existe
      # déjà, ce passage planifié s'arrête, sans doublon ni coût IA supplémentaire.
      - name: Déjà lancé aujourd'hui ?
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # En cas d'erreur de lecture, on ne saute rien : mieux vaut un doublon qu'un jour sans synthèse.
          today=$(date -u +%F)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/sync-briefs.yml/runs?created=>=$today&per_page=30" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.event == "workflow_dispatch") | select(.status != "completed" or .conclusion == "success")] | length' 2>/dev/null) || n=0
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Déjà lancé aujourd'hui (cron Vercel ou lancement manuel) : passage planifié ignoré."
          fi

      - name: Vérifier le secret
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Secret CRON_SECRET absent : Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Récupérer les nouveaux articles
        if: steps.guard.outputs.skip != 'true'
        run: |
          curl -sS --max-time 90 --fail-with-body \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/sync-articles"
          echo

      - name: Rédiger les synthèses, une zone à la fois
        if: steps.guard.outputs.skip != 'true'
        run: |
          failed=0
          for zone in afrique europe moyen-orient indopacifique amerique-du-sud; do
            ok=0
            # Une zone qui échoue garde ses articles non traités : on réessaie une fois.
            for attempt in 1 2; do
              echo "== $zone (essai $attempt)"
              if body=$(curl -sS --max-time 310 --fail-with-body \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$SITE_URL/api/sync-briefs?zone=$zone" 2>&1); then
                echo "$body"
                ok=1
                break
              fi
              echo "$body"
              # Annotation lisible sur la page de l'exécution, sans ouvrir les journaux.
              echo "::error title=Synthèses $zone (essai $attempt)::$(echo "$body" | tr -d '[:cntrl:]' | head -c 400)"
            done
            [ "$ok" = 1 ] || failed=1
          done
          exit $failed
