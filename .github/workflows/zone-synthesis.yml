name: Synthèse de zone 9 h

# Agent de synthèse politico-sécuritaire de chaque zone. GitHub planifie en
# UTC : 7 h 05 UTC = 9 h 05 à Paris en heure d'été (8 h 05 en hiver).
# Tourne ici plutôt que sur Vercel : la recherche web dépasse les 60 s des
# routes du plan Hobby. Ne régénère une zone que si de nouvelles synthèses
# Équinoxe sont arrivées (sauf lancement manuel avec "force").
on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Régénérer même si rien de nouveau"
        type: boolean
        default: false

jobs:
  synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://sahel-conflict-map.vercel.app
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SYNTHESIS_MODEL: ${{ vars.SYNTHESIS_MODEL }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Vérifier les secrets
        run: |
          for name in ANTHROPIC_API_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL CRON_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Secret $name absent : Settings > Secrets and variables > Actions"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Générer les synthèses de zone
        run: npx tsx scripts/zone-synthesis.ts

      - name: Rafraîchir les pages du site
        if: always()
        run: |
          curl -sS --max-time 60 --fail-with-body \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/revalidate"
          echo
