name: Synthèse de zone 9 h

# Agent de synthèse politico-sécuritaire : chaque matin, les cinq zones (une synthèse par
# analyste). Lancé à l'heure par le cron de Vercel (vercel.json, 08:00 UTC à ±59 min,
# soit 9 h - 10 h à Paris en hiver, 10 h - 11 h en été) ; la planification ci-dessous
# reste en secours et s'arrête si le passage du jour a déjà eu lieu.
# Une zone n'est régénérée que si de nouvelles synthèses Équinoxe sont arrivées (sauf
# lancement manuel avec « force »). Recherche web désactivée par défaut (plafond mensuel :
# variable AI_WEB_SEARCH_MONTHLY_CAP). Tourne ici plutôt que sur Vercel (durée).
on:
  schedule:
    - cron: "5 8 * * *"
  workflow_dispatch:
    inputs:
      zone:
        description: "Zone (europe, moyen-orient, afrique, indopacifique, amerique-du-sud) — vide : les cinq"
        type: string
        default: ""
      force:
        description: "Régénérer même si rien de nouveau"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: zone-synthesis
  cancel-in-progress: false

jobs:
  synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://sahel-conflict-map.vercel.app
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SYNTHESIS_MODEL: ${{ vars.SYNTHESIS_MODEL }}
      FORCE: ${{ inputs.force }}
      ZONE_INPUT: ${{ inputs.zone }}
      AI_BUDGET_WARN_USD: ${{ vars.AI_BUDGET_WARN_USD }}
      AI_BUDGET_STOP_USD: ${{ vars.AI_BUDGET_STOP_USD }}
      AI_BUDGET_HARD_USD: ${{ vars.AI_BUDGET_HARD_USD }}
      AI_WEB_SEARCH_MONTHLY_CAP: ${{ vars.AI_WEB_SEARCH_MONTHLY_CAP }}
      AI_WEB_SEARCHES_PER_RUN: ${{ vars.AI_WEB_SEARCHES_PER_RUN }}
    steps:
      # Le cron de Vercel lance ce workflow à l'heure (route /api/cron/dispatch). La
      # planification ci-dessus reste en secours : si un lancement de la journée existe
      # déjà, ce passage planifié s'arrête, sans doublon ni coût IA supplémentaire.
      - name: Déjà lancé aujourd'hui ?
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # En cas d'erreur de lecture, on ne saute rien : mieux vaut un doublon qu'un jour sans synthèse.
          today=$(date -u +%F)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/zone-synthesis.yml/runs?created=>=$today&per_page=30" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.event == "workflow_dispatch") | select(.status != "completed" or .conclusion == "success")] | length' 2>/dev/null) || n=0
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Déjà lancé aujourd'hui (cron Vercel ou lancement manuel) : passage planifié ignoré."
          fi

      - name: Vérifier les secrets
        if: steps.guard.outputs.skip != 'true'
        run: |
          for name in ANTHROPIC_API_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL CRON_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Secret $name absent : Settings > Secrets and variables > Actions"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Générer les synthèses de zone
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -n "$ZONE_INPUT" ]; then
            npx tsx scripts/zone-synthesis.ts "--zone=$ZONE_INPUT"
          else
            npx tsx scripts/zone-synthesis.ts
          fi

      - name: Rafraîchir les pages du site
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          curl -sS --max-time 60 --fail-with-body \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/revalidate"
          echo
