name: Point de situation (brouillons)

# Prépare le brouillon du point de situation de chaque zone, une fois par
# semaine : lundi 7 h à Paris, pour la semaine écoulée. GitHub planifie en UTC :
# 5 h 10 UTC = 7 h 10 à Paris en heure d'été (6 h 10 en hiver — à décaler le
# 25 octobre, comme les autres workflows). Les brouillons ne sont PAS publiés :
# relecture et publication depuis /admin/situation.
on:
  schedule:
    - cron: "10 5 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Préparer un brouillon même si un rapport récent existe"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: situation-report
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SYNTHESIS_MODEL: ${{ vars.SYNTHESIS_MODEL }}
      FORCE: ${{ inputs.force }}
      AI_BUDGET_WARN_USD: ${{ vars.AI_BUDGET_WARN_USD }}
      AI_BUDGET_STOP_USD: ${{ vars.AI_BUDGET_STOP_USD }}
      AI_BUDGET_HARD_USD: ${{ vars.AI_BUDGET_HARD_USD }}
    steps:
      # Le cron de Vercel lance ce workflow à l'heure (route /api/cron/dispatch). La
      # planification ci-dessus reste en secours : si un lancement de la journée existe
      # déjà, ce passage planifié s'arrête, sans doublon ni coût IA supplémentaire.
      - name: Déjà lancé aujourd'hui ?
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # En cas d'erreur de lecture, on ne saute rien : mieux vaut un doublon qu'un jour sans synthèse.
          today=$(date -u +%F)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/situation-report.yml/runs?created=>=$today&per_page=30" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.event == "workflow_dispatch") | select(.status != "completed" or .conclusion == "success")] | length' 2>/dev/null) || n=0
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Déjà lancé aujourd'hui (cron Vercel ou lancement manuel) : passage planifié ignoré."
          fi

      - name: Vérifier les secrets
        if: steps.guard.outputs.skip != 'true'
        run: |
          for name in ANTHROPIC_API_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "Secret $name absent : Settings > Secrets and variables > Actions"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Préparer les brouillons
        if: steps.guard.outputs.skip != 'true'
        run: npx tsx scripts/situation-report.ts
