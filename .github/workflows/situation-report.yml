name: Point de situation (brouillons)

# Prépare le brouillon du point de situation de chaque zone, deux fois par
# semaine : lundi 7 h et jeudi 18 h à Paris. GitHub planifie en UTC : 5 h 10 et
# 16 h 10 UTC = 7 h 10 et 18 h 10 à Paris en heure d'été (6 h 10 et 17 h 10 en
# hiver — à décaler le 25 octobre, comme les autres workflows). Les brouillons
# ne sont PAS publiés : relecture et publication depuis /admin/situation.
on:
  schedule:
    - cron: "10 5 * * 1"
    - cron: "10 16 * * 4"
  workflow_dispatch:
    inputs:
      force:
        description: "Préparer un brouillon même si un rapport récent existe"
        type: boolean
        default: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SYNTHESIS_MODEL: ${{ vars.SYNTHESIS_MODEL }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Vérifier les secrets
        run: |
          for name in ANTHROPIC_API_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "Secret $name absent : Settings > Secrets and variables > Actions"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Préparer les brouillons
        run: npx tsx scripts/situation-report.ts
