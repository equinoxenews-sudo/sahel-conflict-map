name: Point de situation (brouillons)

# Les analystes de zone préparent le brouillon du point de situation de leur zone deux
# fois par semaine : lundi et jeudi, vers 7 h - 8 h à Paris en hiver (cron Vercel 06:00 UTC à
# ±59 min ; la planification ci-dessous reste en secours). Horaires décalés d'une heure le
# 25/10/2026 (heure d'hiver) : à ramener d'une heure plus tôt le 28/03/2027. Chaque édition couvre la
# période depuis la précédente. Modèle dédié : Opus par défaut (variable PSIT_MODEL).
# Les brouillons ne sont PAS publiés : relecture et publication par Nicolas depuis
# /admin/situation (le HQ et Telegram signalent chaque brouillon prêt).
on:
  schedule:
    - cron: "10 6 * * 1,4"
  workflow_dispatch:
    inputs:
      force:
        description: "Préparer un brouillon même si un rapport récent existe"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: situation-report
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      PSIT_MODEL: ${{ vars.PSIT_MODEL }}
      FORCE: ${{ inputs.force }}
      AI_BUDGET_MONTHLY_USD: ${{ vars.AI_BUDGET_MONTHLY_USD }}
    steps:
      # Le cron de Vercel lance ce workflow à l'heure (route /api/cron/dispatch). La
      # planification ci-dessus reste en secours : si un lancement de la journée existe
      # déjà, ce passage planifié s'arrête, sans doublon ni coût IA supplémentaire.
      - name: Déjà lancé aujourd'hui ?
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le point de situation est rédigé par Opus : un passage coûte cher. Le passage de secours ne part
          # donc que si c'est utile :
          #  - rien n'a été lancé aujourd'hui : il rédige tout ;
          #  - un seul lancement a eu lieu et il a ÉCHOUÉ (même en partie) : une seule relance, et le script
          #    ne rédige alors que les zones sans brouillon de moins de 12 h (les zones déjà passées sont
          #    ignorées, sans appel IA) ;
          #  - un lancement a réussi ou est en cours, ou une relance a déjà eu lieu : il ne fait rien.
          # En cas d'erreur de lecture, on ne saute rien.
          today=$(date -u +%F)
          res=$(gh api "repos/${{ github.repository }}/actions/workflows/situation-report.yml/runs?created=>=$today&per_page=30" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion != "cancelled")] | "\(length) \([.[] | select(.status != "completed" or .conclusion == "success")] | length)"' 2>/dev/null) || res="0 0"
          total=${res%% *}
          good=${res##* }
          case "$total" in ''|*[!0-9]*) total=0 ;; esac
          case "$good" in ''|*[!0-9]*) good=0 ;; esac
          if [ "$good" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Un lancement a déjà réussi ou est en cours aujourd'hui : passage de secours ignoré."
          elif [ "$total" -ge 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Une relance a déjà eu lieu aujourd'hui : pas de seconde relance automatique (relancer à la main : Run workflow, force)."
          elif [ "$total" -eq 1 ]; then
            echo "::notice::Le lancement du jour a échoué : relance unique, limitée aux zones sans brouillon récent."
          fi

      - name: Vérifier les secrets
        if: steps.guard.outputs.skip != 'true'
        run: |
          for name in ANTHROPIC_API_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "Secret $name absent : Settings > Secrets and variables > Actions"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Préparer les brouillons
        if: steps.guard.outputs.skip != 'true'
        run: npx tsx scripts/situation-report.ts
